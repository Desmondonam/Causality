name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "ml/**"
      - "backend/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "ml/**"
      - "backend/**"
      - "tests/**"
      - "requirements.txt"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r backend/requirements.txt

      - name: Run the ML pipeline (generates data + model artifacts)
        run: python -m ml.pipeline

      - name: Run ml/ unit tests
        run: pytest tests/ -v --cov=ml --cov-report=xml

      - name: Run backend API tests
        run: pytest backend/tests -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and build artifacts
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m ml.pipeline

      - name: Build backend Docker image
        run: docker build -f backend/Dockerfile -t causality-backend:ci .
